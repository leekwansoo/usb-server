<img id="displayImg" src="/api/camera/Camera1/stream" width="640" height="480">
<canvas id="recordCanvas" width="640" height="480" style="display:none"></canvas>
<canvas id="captureCanvas" width="640" height="480" style="border:2px solid #0f0; margin-top:10px"></canvas>

<br><br>
<button id="btnCapture">1. 화면 캡쳐 (JPG 생성)</button>
<button id="btnRecognize" disabled>2. 안면 인식 실행</button>
<span id="recStatus"></span>
<div id="resultBox"></div>

<script>
const img = document.getElementById("displayImg");
const recordCanvas = document.getElementById("recordCanvas");
const captureCanvas = document.getElementById("captureCanvas");
const rCtx = recordCanvas.getContext("2d");
const cCtx = captureCanvas.getContext("2d");

let capturedBlob = null;

// MJPEG -> 숨은 canvas에 계속 그리기 (녹화용과 동일)
function drawLoop() {
    if (img.complete && img.naturalWidth > 0) {
        rCtx.drawImage(img, 0, 0, recordCanvas.width, recordCanvas.height);
    }
    requestAnimationFrame(drawLoop);
}
drawLoop();

// 1. 캡쳐 버튼
document.getElementById("btnCapture").onclick = () => {
    // 현재 화면을 캡쳐 캔버스에 복사
    cCtx.drawImage(recordCanvas, 0, 0, captureCanvas.width, captureCanvas.height);
    
    // JPG Blob 생성
    captureCanvas.toBlob(blob => {
        capturedBlob = blob;
        document.getElementById("recStatus").innerText = `JPG 생성 완료 (${(blob.size/1024).toFixed(1)}KB)`;
        document.getElementById("btnRecognize").disabled = false;
        
        // 로컬 다운로드도 하고 싶으면
        // const a = document.createElement('a');
        // a.href = URL.createObjectURL(blob);
        // a.download = `capture_${Date.now()}.jpg`;
        // a.click();
    }, 'image/jpeg', 0.9);
};

// 2. 인식 버튼
document.getElementById("btnRecognize").onclick = async () => {
    if (!capturedBlob) return alert("먼저 캡쳐하세요");
    
    document.getElementById("recStatus").innerText = "인식중...";
    const formData = new FormData();
    formData.append("file", capturedBlob, "capture.jpg");

    const res = await fetch("/api/camera/Camera1/capture", {
        method: "POST",
        body: formData
    });
    const data = await res.json();
    
    // 결과 박스 그리기
    document.getElementById("recStatus").innerText = `인식 완료: ${data.count}명`;
    document.getElementById("resultBox").innerText = JSON.stringify(data.detections, null, 2);

    // 캡쳐 캔버스에 박스 그리기
    data.detections.forEach(d => {
        cCtx.strokeStyle = "#00FF00";
        cCtx.lineWidth = 3;
        cCtx.strokeRect(d.x1, d.y1, d.x2-d.x1, d.y2-d.y1);
        cCtx.fillStyle = "#00FF00";
        cCtx.fillText(`face ${d.conf.toFixed(2)}`, d.x1, d.y1-5);
    });
};
</script>
