<html>
<head>
    <title>Face Detection</title>
</head>
<body>
    <h2>Face Detection</h2>
    <div>
        <img id="displayImg" src="/api/webcam/stream" width="640" height="480">
        <canvas id="faceCanvas" width="640" height="480" style="display:none"></canvas>

        <br><br>
        <input type="name" id="name_id" placeholder="Enter name">
        <button id="capture">1. 화면 캡쳐 (JPG 생성)</button>
        <button id="recognize" disabled>2. 안면 인식 실행</button>
        <span id="recStatus"></span>
        <div id="resultBox"></div>
    </div>

<script>
const img = document.getElementById("displayImg");
const faceCanvas = document.getElementById("faceCanvas");
const rCtx = faceCanvas.getContext("2d");

let capturedBlob = null;

// MJPEG -> 숨은 canvas에 계속 그리기 (녹화용과 동일)
function drawLoop() {
    if (img.complete && img.naturalWidth > 0) {
        rCtx.drawImage(img, 0, 0, faceCanvas.width, faceCanvas.height);
    }
    requestAnimationFrame(drawLoop);
}
drawLoop();

// 1. 캡쳐 버튼
document.getElementById("capture").onclick = () => {
    // 현재 화면을 캡쳐 캔버스에 복사
    rCtx.drawImage(faceCanvas, 0, 0, faceCanvas.width, faceCanvas.height);
    
    // JPG Blob 생성
    faceCanvas.toBlob(blob => {
        capturedBlob = blob;
        document.getElementById("recStatus").innerText = `JPG 생성 완료 (${(blob.size/1024).toFixed(1)}KB)`;
        document.getElementById("recognize").disabled = false;
        
        // 로컬 다운로드도 하고 싶으면
        // const a = document.createElement('a');
        // a.href = URL.createObjectURL(blob);
        // a.download = `capture_${Date.now()}.jpg`;
        // a.click();
    }, 'image/jpeg', 0.9);
};

// 2. 인식 버튼
document.getElementById("recognize").onclick = async () => {
    if (!capturedBlob) return alert("먼저 캡쳐하세요");
    
    document.getElementById("recStatus").innerText = "인식중...";
    const formData = new FormData();
    formData.append("file", capturedBlob, "capture.jpg");

    const res = await fetch(`/api/webcam/capture/${document.getElementById("name_id").value}`, {
        method: "POST",
        body: formData
    });
    const data = await res.json();
    
    // 결과 박스 그리기
    document.getElementById("recStatus").innerText = `인식 완료: ${data.count}명`;
    document.getElementById("resultBox").innerText = JSON.stringify(data.detections, null, 2);

    // 캡쳐 캔버스에 박스 그리기
    data.detections.forEach(d => {
        rCtx.strokeStyle = "#00FF00";
        rCtx.lineWidth = 3;
        rCtx.strokeRect(d.x1, d.y1, d.x2-d.x1, d.y2-d.y1);
        rCtx.fillStyle = "#00FF00";
        rCtx.fillText(`face ${d.conf.toFixed(2)}`, d.x1, d.y1-5);
    });
};
</script>
</body>
</html>
